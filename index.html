<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Prompt Builder</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1f1e1c; --muted:#6b6862; --accent:#c96442; --line:#e4e1da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --card:#262522; --ink:#ecebe7; --muted:#a19e97; --line:#3a3834; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin:0 0 4px; font-size: 1.8rem; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  .hint { font-weight:400; color:var(--muted); font-size:.9rem; }
  textarea, input, select { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  textarea:focus, input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  #brief { min-height:120px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .row > div { flex:1 1 200px; }
  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:11px 18px; cursor:pointer; background:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.6; cursor:wait; }
  .actions { display:flex; gap:10px; margin-top:16px; align-items:center; flex-wrap:wrap; }
  #status { color:var(--muted); font-size:.95rem; }
  #status.error { color:#d13c3c; }
  pre { white-space:pre-wrap; word-wrap:break-word; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:16px; margin:0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:.9rem; max-height:70vh; overflow:auto; }
  details summary { cursor:pointer; font-weight:600; }
  .out-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .out-head h2 { margin:0; font-size:1.15rem; }
</style>
</head>
<body>
<main>
  <h1>Master Prompt Builder</h1>
  <p class="sub">Tulis permintaan singkat. AI akan menganalisisnya dan menyusun master prompt lengkap dengan struktur: peran, konteks, tugas, aturan, contoh, format jawaban, dan cara berpikir.</p>

  <div class="card">
    <details id="settings">
      <summary>Pengaturan API <span class="hint">(opsional, untuk hasil langsung di sini; berbayar)</span></summary>
      <div class="row">
        <div>
          <label for="apiKey">Anthropic API key <span class="hint">(disimpan hanya di browser ini)</span></label>
          <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (cepat)</option>
            <option value="claude-opus-5-5">Claude Opus 5.5 (paling pintar)</option>
            <option value="claude-haiku-5-5">Claude Haiku 5.5 (paling hemat)</option>
          </select>
        </div>
      </div>
    </details>
  </div>

  <form class="card" id="form">
    <label for="brief">Prompt singkat Anda</label>
    <textarea id="brief" required placeholder="Contoh: bantu saya bikin konten Instagram untuk toko kue rumahan saya selama sebulan"></textarea>
    <div class="row">
      <div>
        <label for="lang">Bahasa master prompt</label>
        <select id="lang">
          <option value="Indonesia">Bahasa Indonesia</option>
          <option value="English">English</option>
        </select>
      </div>
      <div>
        <label for="extra">Info tambahan <span class="hint">(opsional)</span></label>
        <input id="extra" placeholder="mis. target audiens ibu muda, budget kecil">
      </div>
    </div>
    <div class="actions">
      <button type="button" id="free">Gratis: Salin &amp; buka Claude</button>
      <button type="submit" id="go" class="secondary">Buat di sini (API key)</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </form>

  <section class="card" id="result" hidden>
    <div class="out-head">
      <h2 id="outTitle">Master prompt Anda</h2>
      <div class="actions" style="margin:0">
        <button type="button" class="secondary" id="copy">Salin</button>
        <button type="button" class="secondary" id="download">Unduh .txt</button>
      </div>
    </div>
    <pre id="output"></pre>
  </section>
</main>

<script>
const SYSTEM_PROMPT = `Kamu adalah prompt engineer kelas dunia yang ahli menulis prompt untuk Claude.

Pengguna akan memberi permintaan singkat. Tugasmu:
1. Analisis permintaan itu: apa tujuan sebenarnya, siapa penggunanya, siapa audiens hasil akhirnya, keahlian apa yang dibutuhkan, dan apa yang belum disebutkan.
2. Ubah menjadi master prompt lengkap yang mengikuti PERSIS struktur berikut, dengan tag XML dan urutan yang sama:

<peran>
Kamu adalah [peran/keahlian spesifik yang paling cocok].
Gaya komunikasimu: [gaya yang sesuai].
</peran>

<konteks>
Tentang saya: ...
Situasi saat ini: ...
Audiens hasil akhir: ...
Tujuan akhir: ...
</konteks>

<tugas>
[Satu kalimat tugas utama yang jelas.]

Langkah yang harus kamu lakukan:
1. ...
2. ...
3. ...
</tugas>

<aturan>
- WAJIB: ...
- JANGAN: ... (sertakan alasan singkat, mis. "karena ...")
- Batasan: ...
- Kalau informasi kurang atau ambigu, tanyakan dulu maksimal 3 pertanyaan sebelum mengerjakan.
- Kalau kamu tidak yakin akan suatu fakta, katakan terus terang. Jangan mengarang.
</aturan>

<contoh>
...
</contoh>

<format_jawaban>
- Struktur: ...
- Panjang: ...
- Bahasa: ...
- Akhiri dengan: ...
</format_jawaban>

<cara_berpikir>
Sebelum menjawab, pikirkan dulu langkah demi langkah: pahami masalahnya, pertimbangkan beberapa pendekatan, lalu pilih yang terbaik dan jelaskan alasannya singkat.
Setelah selesai, periksa ulang jawabanmu terhadap <aturan> dan <format_jawaban>.
</cara_berpikir>

Pedoman:
- Isi setiap bagian sekonkret dan sespesifik mungkin berdasarkan permintaan. Simpulkan hal yang masuk akal (peran ahli, langkah kerja, aturan, format) dan jangan biarkan bagian kosong.
- Hanya untuk fakta pribadi yang benar-benar tidak bisa ditebak (nama bisnis, angka, data milik pengguna), tulis placeholder dalam format [isi: penjelasan singkat] agar pengguna tahu apa yang harus dilengkapi.
- Di <contoh>, berikan satu contoh singkat hasil yang diharapkan, atau tulis [isi: tempel contoh gaya yang Anda sukai] jika contoh sangat bergantung pada selera pengguna.
- Langkah kerja di <tugas> 3–7 langkah. Aturan harus relevan dengan tugas, bukan generik.
- Tulis seluruh master prompt dalam bahasa yang diminta.
- Keluarkan HANYA master prompt itu. Tanpa pembuka, penutup, penjelasan, atau blok kode markdown.`;

const $ = id => document.getElementById(id);
const apiKey = $('apiKey'), model = $('model'), status = $('status'), output = $('output'), go = $('go');

apiKey.value = localStorage.getItem('mpb_key') || '';
model.value = localStorage.getItem('mpb_model') || model.value;
apiKey.addEventListener('change', () => localStorage.setItem('mpb_key', apiKey.value.trim()));
model.addEventListener('change', () => localStorage.setItem('mpb_model', model.value));

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className = isError ? 'error' : '';
}

function buildUserMsg() {
  const extra = $('extra').value.trim();
  return `Bahasa master prompt: ${$('lang').value}\n\nPermintaan singkat:\n${$('brief').value.trim()}` +
    (extra ? `\n\nInfo tambahan dari pengguna:\n${extra}` : '');
}

// Free mode: no API call; user pastes the combined prompt into claude.ai (works on the free plan).
$('free').addEventListener('click', async () => {
  if (!$('form').reportValidity()) return;
  const full = `${SYSTEM_PROMPT}\n\n---\n\n${buildUserMsg()}`;
  $('outTitle').textContent = 'Prompt untuk ditempel di claude.ai';
  output.textContent = full;
  $('result').hidden = false;
  try {
    await navigator.clipboard.writeText(full); // copy before opening the tab: clipboard needs page focus
    setStatus('Tersalin! Tempel (Ctrl+V) di tab Claude yang baru terbuka, lalu kirim.');
  } catch {
    setStatus('Gagal menyalin otomatis. Salin prompt di bawah secara manual, lalu tempel di Claude.', true);
  }
  window.open('https://claude.ai/new', '_blank', 'noopener');
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const key = apiKey.value.trim();
  if (!key) { $('settings').open = true; apiKey.focus(); return setStatus('Isi API key di Pengaturan API, atau pakai tombol Gratis.', true); }

  const userMsg = buildUserMsg();

  go.disabled = true;
  setStatus('Menganalisis dan menyusun master prompt…');
  try {
    // Direct browser call; key never leaves this browser except to api.anthropic.com.
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model.value,
        max_tokens: 4096,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userMsg }]
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    if (!text) throw new Error('Respons kosong dari API.');
    $('outTitle').textContent = 'Master prompt Anda';
    output.textContent = text;
    $('result').hidden = false;
    $('result').scrollIntoView({ behavior: 'smooth' });
    setStatus(data.stop_reason === 'max_tokens' ? 'Selesai, tapi terpotong karena terlalu panjang.' : 'Selesai.');
  } catch (err) {
    setStatus('Gagal: ' + err.message, true);
  } finally {
    go.disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(output.textContent);
  setStatus('Tersalin ke clipboard.');
});

$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([output.textContent], { type: 'text/plain' }));
  a.download = 'master-prompt.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
